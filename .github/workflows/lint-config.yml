name: Lint Config

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-config:
    name: Config structure lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run config lint suite
        id: lint
        continue-on-error: true
        run: npm test

      - name: Build PR comment
        if: always()
        run: node lint/format-report.js pr-comment.md

      - name: Upsert PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- masq-config-lint -->';
            const body = fs.existsSync('pr-comment.md')
              ? fs.readFileSync('pr-comment.md', 'utf8')
              : `${marker}\n## Config lint\n\nLint results were unavailable.`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find(
              (c) => c.user?.type === 'Bot' && c.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail job when lint failed
        if: steps.lint.outcome == 'failure'
        run: |
          echo "Config lint suite failed. See the PR comment for failure lines."
          exit 1
